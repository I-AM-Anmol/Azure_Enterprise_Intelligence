<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#1B2A4A"/>
  <!-- DNA strand 1 (infinity path - top) -->
  <path d="M110 95 C110 50, 165 50, 200 95 C235 140, 290 140, 290 95"
        fill="none" stroke="#00B8A9" stroke-width="5" stroke-linecap="round"/>
  <!-- DNA strand 2 (infinity path - bottom) -->
  <path d="M110 95 C110 140, 165 140, 200 95 C235 50, 290 50, 290 95"
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <!-- Cross-links (base pairs) -->
  <line x1="135" y1="75" x2="135" y2="115" stroke="#00B8A9" stroke-width="2" opacity="0.4"/>
  <line x1="155" y1="67" x2="155" y2="123" stroke="#00B8A9" stroke-width="2" opacity="0.4"/>
  <line x1="175" y1="72" x2="175" y2="118" stroke="#00B8A9" stroke-width="2" opacity="0.4"/>
  <line x1="225" y1="72" x2="225" y2="118" stroke="#00B8A9" stroke-width="2" opacity="0.4"/>
  <line x1="245" y1="67" x2="245" y2="123" stroke="#00B8A9" stroke-width="2" opacity="0.4"/>
  <line x1="265" y1="75" x2="265" y2="115" stroke="#00B8A9" stroke-width="2" opacity="0.4"/>
  <!-- Central nexus glow -->
  <circle cx="200" cy="95" r="14" fill="#00B8A9" opacity="0.3"/>
  <circle cx="200" cy="95" r="8" fill="#FFFFFF"/>
  <circle cx="200" cy="95" r="4" fill="#00B8A9"/>
  <!-- Text -->
  <text x="200" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">INFINITY NEXUS</text>
  <text x="200" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#94A3B8">Clinical Intelligence</text>
</svg>