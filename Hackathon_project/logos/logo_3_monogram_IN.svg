<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#1B2A4A"/>
  <!-- Geometric I -->
  <path d="M155 55 L155 135" fill="none" stroke="#00B8A9" stroke-width="8" stroke-linecap="round"/>
  <!-- N that flows into infinity -->
  <path d="M175 135 L175 55 L225 135 L225 55" fill="none" stroke="#00B8A9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Infinity loop extending from N's diagonal -->
  <path d="M225 55 C245 55, 260 70, 260 85 C260 105, 240 110, 225 95 C210 80, 195 80, 195 95 C195 110, 210 115, 225 105"
        fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- Nexus dot at crossing -->
  <circle cx="225" cy="95" r="5" fill="#FFFFFF"/>
  <!-- Text -->
  <text x="200" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">INFINITY NEXUS</text>
</svg>