<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#1B2A4A"/>
  <!-- Infinity loop -->
  <path d="M120 100 C120 60, 180 60, 200 100 C220 140, 280 140, 280 100 C280 60, 220 60, 200 100 C180 140, 120 140, 120 100 Z"
        fill="none" stroke="#00B8A9" stroke-width="6" stroke-linecap="round"/>
  <!-- Central nexus node -->
  <circle cx="200" cy="100" r="12" fill="#00B8A9"/>
  <circle cx="200" cy="100" r="6" fill="#FFFFFF"/>
  <!-- Radiating connection lines -->
  <line x1="200" y1="88" x2="200" y2="70" stroke="#00B8A9" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="112" x2="200" y2="130" stroke="#00B8A9" stroke-width="2" opacity="0.6"/>
  <line x1="188" y1="96" x2="175" y2="83" stroke="#00B8A9" stroke-width="2" opacity="0.6"/>
  <line x1="212" y1="96" x2="225" y2="83" stroke="#00B8A9" stroke-width="2" opacity="0.6"/>
  <line x1="188" y1="104" x2="175" y2="117" stroke="#00B8A9" stroke-width="2" opacity="0.6"/>
  <line x1="212" y1="104" x2="225" y2="117" stroke="#00B8A9" stroke-width="2" opacity="0.6"/>
  <!-- Small nodes at line ends -->
  <circle cx="200" cy="70" r="3" fill="#00B8A9" opacity="0.6"/>
  <circle cx="200" cy="130" r="3" fill="#00B8A9" opacity="0.6"/>
  <circle cx="175" cy="83" r="3" fill="#00B8A9" opacity="0.6"/>
  <circle cx="225" cy="83" r="3" fill="#00B8A9" opacity="0.6"/>
  <circle cx="175" cy="117" r="3" fill="#00B8A9" opacity="0.6"/>
  <circle cx="225" cy="117" r="3" fill="#00B8A9" opacity="0.6"/>
  <!-- Text -->
  <text x="200" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">INFINITY NEXUS</text>
</svg>