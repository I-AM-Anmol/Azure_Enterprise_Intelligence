<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#1B2A4A"/>
  <!-- Orbit path 1 (tilted ellipse - figure 8 left) -->
  <ellipse cx="170" cy="90" rx="55" ry="30" fill="none" stroke="#00B8A9" stroke-width="2.5"
           transform="rotate(-25 170 90)" opacity="0.7"/>
  <!-- Orbit path 2 (tilted ellipse - figure 8 right) -->
  <ellipse cx="230" cy="90" rx="55" ry="30" fill="none" stroke="#00B8A9" stroke-width="2.5"
           transform="rotate(25 230 90)" opacity="0.7"/>
  <!-- Central nexus - bright glow -->
  <circle cx="200" cy="90" r="20" fill="#00B8A9" opacity="0.15"/>
  <circle cx="200" cy="90" r="13" fill="#00B8A9" opacity="0.3"/>
  <circle cx="200" cy="90" r="8" fill="#00B8A9"/>
  <circle cx="200" cy="90" r="4" fill="#FFFFFF"/>
  <!-- Orbiting data nodes -->
  <circle cx="130" cy="72" r="5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="270" cy="72" r="5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="155" cy="115" r="4" fill="#00B8A9" opacity="0.8"/>
  <circle cx="245" cy="115" r="4" fill="#00B8A9" opacity="0.8"/>
  <circle cx="200" cy="58" r="3.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="200" cy="122" r="3.5" fill="#FFFFFF" opacity="0.6"/>
  <!-- Motion trails -->
  <path d="M130 72 Q140 68, 150 70" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <path d="M270 72 Q260 68, 250 70" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <!-- Text -->
  <text x="200" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">INFINITY NEXUS</text>
  <text x="200" y="173" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#94A3B8">Data Flows. Insights Connect.</text>
</svg>