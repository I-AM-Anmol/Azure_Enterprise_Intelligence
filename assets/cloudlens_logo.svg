<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>

  <!-- ── Cloud body ───────────────────────────── -->
  <g transform="translate(5, 9)">
    <path d="
      M 4 50
      Q 0 50 0 44
      Q 0 36 8 34
      Q 6 22 16 20
      Q 14 10 24 10
      Q 30 10 33 15
      Q 36  6 46  6
      Q 58  6 60 18
      Q 68 16 72 24
      Q 78 26 76 38
      Q 74 50 66 50
      Z
    " fill="url(#cloudGrad)"/>

    <!-- ── Magnifying glass circle ────────────── -->
    <circle cx="40" cy="30" r="13"
            fill="url(#lensGrad)"
            stroke="white" stroke-width="2.2"/>

    <!-- Lens inner glint (top-left highlight) -->
    <ellipse cx="34" cy="24" rx="4" ry="2.5"
             fill="white" opacity="0.38"
             transform="rotate(-35 34 24)"/>

    <!-- ── Handle ──────────────────────────────── -->
    <line x1="50" y1="41" x2="62" y2="53"
          stroke="white" stroke-width="2.8"
          stroke-linecap="round"/>
    <circle cx="62" cy="53" r="1.6" fill="white" opacity="0.7"/>
  </g>

  <!-- ── Wordmark ────────────────────────────── -->
  <text x="97" y="37"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="27" font-weight="700"
        fill="white" letter-spacing="-0.4">Cloud<tspan fill="#93c5fd">Lens</tspan>
  </text>

  <!-- ── Tagline ─────────────────────────────── -->
  <text x="98" y="52"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="8.5" fill="rgba(255,255,255,0.38)"
        letter-spacing="2">FINOPS INTELLIGENCE
  </text>
</svg>
