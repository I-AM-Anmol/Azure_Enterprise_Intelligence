<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>

  <!-- ── Compact cloud icon (left) ──────────────────────── -->
  <g transform="translate(2, 9)">
    <path d="
      M 3 36
      Q 0 36 0 30  Q 0 23  7 22
      Q 5 13 14 13  Q 12  6 21  6
      Q 27  6 29 11  Q 31  5 38  5
      Q 47  5 47 15  Q 52 15 54 21
      Q 57 24 54 32  Q 52 39 44 39
      Z
    " fill="url(#cg)"/>

    <!-- Magnifying glass circle -->
    <circle cx="29" cy="23" r="10"
            fill="url(#lg)" stroke="white" stroke-width="1.8"/>

    <!-- Lens glint -->
    <ellipse cx="24" cy="18" rx="3" ry="1.8"
             fill="white" opacity="0.42"
             transform="rotate(-35 24 18)"/>

    <!-- Handle -->
    <line x1="36" y1="30" x2="46" y2="40"
          stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="46" cy="40" r="1.4" fill="white" opacity="0.7"/>
  </g>

  <!-- ── Wordmark — large, Flexera-style ───────────────── -->
  <text x="64" y="34"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="700"
        fill="white" letter-spacing="-0.3">Cloud<tspan fill="#93c5fd">Lens</tspan>
  </text>

  <!-- ── Tagline ─────────────────────────────────────────── -->
  <text x="65" y="48"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="8" fill="rgba(255,255,255,0.38)"
        letter-spacing="2">FINOPS INTELLIGENCE
  </text>
</svg>
